name: End-to-end tests

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      interop:
        type: boolean
        default: false
  pull_request:
    paths:
      - "frontend/**"
      - "backend-api/backend/**"
      - "agent/**"
      - "scripts/ci/native-test-tools.sh"
      - ".github/workflows/e2e.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright against native services
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.12.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Prepare native services
        run: |
          sudo apt-get update -q
          sudo apt-get install -y nginx libnginx-mod-http-js
          printf '%s\n' '127.0.0.1 proxy-upstream.e2e.test' | sudo tee -a /etc/hosts >/dev/null
          bash scripts/ci/native-test-tools.sh browser
      - name: Install the backend
        working-directory: backend-api/backend
        run: |
          pip install --require-hashes -r poetry-requirements.txt
          poetry config virtualenvs.create false
          poetry install --with dev
      - run: npm ci
        working-directory: agent
      - name: Install and build the frontend
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          node scripts/check-runtime-config.ts
          npm run build:runtime
          npx playwright install --with-deps chromium firefox webkit
      - name: Run browser tests
        working-directory: backend-api/backend
        env:
          INTEROP: ${{ inputs.interop }}
        run: |
          args=()
          if [[ "$INTEROP" == true ]]; then args+=(--interop); fi
          python -m tests.run_browser "${args[@]}" -- --project=chromium --project=firefox --project=webkit
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report
          path: frontend/playwright-report/
