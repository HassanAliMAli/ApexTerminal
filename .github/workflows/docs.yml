name: Docs

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "website/**"
      - "backend-api/backend/**"
      - "frontend/**"
      - "agent/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend reference data
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-api/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          pip install --require-hashes -r poetry-requirements.txt
          poetry config virtualenvs.create false
          poetry install --only main
      - name: Write the data, which fails when the code cannot produce it
        run: |
          while IFS= read -r setting; do declare -x "$setting"; done < <(sed -n 's/^    \([A-Z_]*=.*\)$/\1/p' pytest.ini)
          python -m scripts.export_reference_data
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-reference-data
          path: backend-api/backend/reference-data
          if-no-files-found: error

  agent:
    name: Agent reference data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
      - run: npm ci
        working-directory: agent
      - name: Write reference data
        working-directory: agent
        run: node --import ./tests/setup.ts scripts/export-reference.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-reference-data
          path: agent/reference-data
          if-no-files-found: error

  frontend:
    name: Web app reference data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - name: Write reference data
        working-directory: frontend
        run: npm run reference
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-reference-data
          path: frontend/reference-data
          if-no-files-found: error

  build:
    name: Generate, types and build
    needs: [backend, agent, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend-reference-data
          path: backend-api/backend/reference-data
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: agent-reference-data
          path: agent/reference-data
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-reference-data
          path: frontend/reference-data
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
      - run: npm ci --ignore-scripts
        working-directory: website
      - name: Generate the reference data, which fails when a page is out of step with the code
        working-directory: website
        run: node --disable-warning=ExperimentalWarning scripts/generate.mts
      - name: Check the types
        working-directory: website
        run: npm run typecheck
      - name: Test the code of the site
        working-directory: website
        run: node --disable-warning=ExperimentalWarning --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test "tests/**/*.test.ts"
      - name: Build the site, which fails on a broken link or anchor
        working-directory: website
        run: npm run build
      - name: Check that the build wrote llms.txt
        run: test -s website/build/llms.txt
      - name: Check that every page with headings has a table of contents
        working-directory: website
        run: node --disable-warning=ExperimentalWarning scripts/check-toc.mts
