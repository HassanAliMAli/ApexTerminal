name: Local security rules

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: local-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan change history with redaction
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          stage=$(mktemp -d)
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSL "$base/$archive" -o "$stage/$archive"
          curl -fsSL "$base/gitleaks_8.30.1_checksums.txt" -o "$stage/checksums.txt"
          (cd "$stage" && sha256sum --ignore-missing -c checksums.txt)
          tar -xzf "$stage/$archive" -C "$stage" gitleaks
          [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          "$stage/gitleaks" git --redact=100 --no-banner --log-opts="$BASE_SHA..HEAD" .
      - name: Scan local rules
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/python" -m pip install --disable-pip-version-check semgrep==1.187.0
          PATH="$RUNNER_TEMP/semgrep/bin:$PATH" bash scripts/ai-engineering/check.sh sast
