name: Example plugins

on:
  pull_request:
    paths:
      - "docs/examples/**"
      - ".github/workflows/examples.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reference-backend:
    name: Reference backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/examples/reference-backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: |
          python -m venv python/.venv
          python/.venv/bin/pip install --require-hashes -r python/requirements.txt
      - run: node --test test/parity.test.mjs
        env:
          PYTHON: python/.venv/bin/python

  reference-agent:
    name: Reference agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/examples/reference-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: |
          python -m venv python/.venv
          python/.venv/bin/pip install --require-hashes -r python/requirements.txt
      - run: node --test test/parity.test.mjs
        env:
          PYTHON: python/.venv/bin/python

  plotly-charts:
    name: Plotly charts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/examples/plotly-charts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test

  ag-grid:
    name: AgGrid
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Install the SQL explorer, whose editor and backend AgGrid reuses
        working-directory: docs/examples/sql-explorer
        run: npm ci --ignore-scripts
      - name: Build AgGrid
        working-directory: docs/examples/ag-grid
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Start native PostgreSQL
        run: |
          sudo apt-get update -q
          sudo apt-get install -y bison flex zlib1g-dev
          bash scripts/ci/example-postgres.sh 55433
      - name: Test AgGrid
        working-directory: docs/examples/ag-grid
        run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes -r ../backend/requirements-test.txt
          npm test

  sql-explorer:
    name: SQL explorer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: docs/examples/sql-explorer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes -r ../backend/requirements-test.txt
      - name: Start native PostgreSQL
        working-directory: .
        run: |
          sudo apt-get update -q
          sudo apt-get install -y bison flex zlib1g-dev
          bash scripts/ci/example-postgres.sh 55432
      - run: npm test

  backend:
    name: Examples backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Test the native examples backend
        working-directory: docs/examples/backend
        run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes -r requirements-test.txt
          .venv/bin/python -m pytest -q tests
